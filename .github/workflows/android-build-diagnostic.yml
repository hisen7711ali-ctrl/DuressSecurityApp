name: Android build diagnostic

on:
  workflow_dispatch:
  push:
    branches: [main, fix/pin-routing-vault-files-2026-10-17, fix/owner-pin-routing-lock-icon-2026-10-17]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools platforms;android-35 build-tools;35.0.0
      - name: Install npm dependencies
        run: npm install --no-audit --no-fund
      - name: Tests
        shell: bash
        run: |
          set +e
          npm test 2>&1 | tee npm-test.log
          code=${PIPESTATUS[0]}
          exit "$code"
      - name: Upload test log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-diagnostic-test-log
          path: npm-test.log
          if-no-files-found: ignore
          retention-days: 3
      - name: TypeScript
        run: npm run typecheck
      - name: Sync and inspect Gradle JVM configuration
        shell: bash
        run: |
          set -euo pipefail
          npm run android:setup
          npx cap sync android
          node scripts/align-android-jvm.mjs
          cd android
          ./gradlew --version
          ./gradlew :app:compileDebugJavaWithJavac :app:compileDebugKotlin --console=plain
      - name: Build APK with log capture
        shell: bash
        run: |
          set +e
          npm run apk:debug 2>&1 | tee android-build.log
          code=${PIPESTATUS[0]}
          exit "$code"
      - name: Upload Android build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-build-diagnostic-log
          path: android-build.log
          if-no-files-found: ignore
          retention-days: 3
      - name: Upload verified debug APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: duress-security-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
