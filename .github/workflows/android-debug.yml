name: Android debug APK

on:
  workflow_dispatch:
  push:
    branches: [main, master, merged-fix, fix/maintenance-and-app-lock, fix/owner-pin-routing-lock-icon-2026-10-17]

permissions:
  contents: write

# Every push creates a new run. Keep the newest branch revision in CI and
# cancel stale builds so repeated documentation/fix commits do not queue many
# Gradle builds in parallel and delay the artifact needed for testing.
concurrency:
  group: android-debug-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-debug-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools platforms;android-35 build-tools;35.0.0
      - name: Resolve available dependency fixes without force or major upgrades
        run: npm audit fix --package-lock-only --no-fund
      - name: Upload refreshed lockfile for review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: duress-security-refreshed-package-lock
          path: package-lock.json
          if-no-files-found: error
          retention-days: 7
      - name: Install from the refreshed lockfile
        run: npm ci --no-audit --no-fund
      - name: Generate npm audit report
        if: always()
        shell: bash
        run: |
          set +e
          npm audit --json > npm-audit.json
          audit_exit=$?
          set -e
          echo "npm audit exit code: $audit_exit" >> npm-audit.json.summary
          node --input-type=module -e '
            import fs from "node:fs";
            try {
              const report = JSON.parse(fs.readFileSync("npm-audit.json", "utf8"));
              const v = report.metadata?.vulnerabilities ?? {};
              const line = "npm audit: " + (v.total ?? "unknown") + " findings — critical " + (v.critical ?? 0) + ", high " + (v.high ?? 0) + ", moderate " + (v.moderate ?? 0) + ", low " + (v.low ?? 0);
              console.log(line);
              fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, line + "\n");
              for (const [name, item] of Object.entries(report.vulnerabilities ?? {})) {
                console.log("- " + name + ": " + item.severity + "; direct=" + item.isDirect + "; fixAvailable=" + JSON.stringify(item.fixAvailable));
              }
            } catch {
              console.log("npm audit returned no parseable JSON report; inspect npm-audit.json and npm install output.");
            }
          '
      - name: Upload npm audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: duress-security-npm-audit-report
          path: |
            npm-audit.json
            npm-audit.json.summary
          if-no-files-found: warn
          retention-days: 7
      - name: Fail CI when high or critical dependency advisories remain
        run: npm audit --audit-level=high
      - name: Run tests
        shell: bash
        run: |
          set +e
          npm test 2>&1 | tee npm-test.log
          code=${PIPESTATUS[0]}
          exit "$code"
      - name: Upload test log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: duress-security-test-log
          path: npm-test.log
          if-no-files-found: error
          retention-days: 7
      - name: Check TypeScript
        shell: bash
        run: |
          set +e
          npm run typecheck 2>&1 | tee typecheck.log
          code=${PIPESTATUS[0]}
          exit "$code"
      - name: Upload TypeScript log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: duress-security-typecheck-log
          path: typecheck.log
          if-no-files-found: error
          retention-days: 7
      - name: Check authentication invariants
        shell: bash
        run: |
          set -euo pipefail
          npm run dev > dev-server.log 2>&1 &
          DEV_PID=$!
          cleanup() {
            kill "$DEV_PID" 2>/dev/null || true
            wait "$DEV_PID" 2>/dev/null || true
          }
          trap cleanup EXIT
          ready=0
          for _ in $(seq 1 60); do
            if curl --fail --silent --show-error http://127.0.0.1:8080/__app-env >/dev/null; then
              ready=1
              break
            fi
            sleep 1
          done
          if [ "$ready" -ne 1 ]; then
            echo 'ERROR: wrapped Vite dev server did not become ready.' >&2
            cat dev-server.log >&2 || true
            exit 1
          fi
          npm run check:auth
      - name: Lint source
        shell: bash
        run: |
          set +e
          npm run lint 2>&1 | tee lint.log
          code=${PIPESTATUS[0]}
          exit "$code"
      - name: Upload lint log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: duress-security-lint-log
          path: lint.log
          if-no-files-found: ignore
          retention-days: 7
      - name: Build debug APK
        run: npm run apk:debug
      - name: Verify final APK is offline, calculator-branded, and structurally complete
        shell: bash
        run: |
          set -euo pipefail
          APK="android/app/build/outputs/apk/debug/app-debug.apk"
          AAPT="$ANDROID_HOME/build-tools/35.0.0/aapt"
          test -f "$APK"
          test -x "$AAPT"
          "$AAPT" dump permissions "$APK" | tee apk-permissions.txt
          for permission in \
            'android.permission.USE_BIOMETRIC' \
            'android.permission.RECEIVE_BOOT_COMPLETED' \
            'android.permission.POST_NOTIFICATIONS' \
            'android.permission.SYSTEM_ALERT_WINDOW' \
            'android.permission.PACKAGE_USAGE_STATS'; do
            if ! grep -Fq "$permission" apk-permissions.txt; then
              echo "ERROR: final APK is missing required permission $permission" >&2
              exit 1
            fi
          done
          for forbidden in \
            'android.permission.INTERNET' \
            'android.permission.ACCESS_NETWORK_STATE' \
            'android.permission.QUERY_ALL_PACKAGES'; do
            if grep -Fq "$forbidden" apk-permissions.txt; then
              echo "ERROR: final APK declares forbidden broad/network permission $forbidden" >&2
              exit 1
            fi
          done
          "$AAPT" dump xmltree "$APK" AndroidManifest.xml | tee apk-manifest.txt
          for component in \
            'com.duresssecurity.admin.AdminReceiver' \
            'com.duresssecurity.admin.BootCompletedReceiver' \
            'com.duresssecurity.admin.AppLockAccessibilityService' \
            'com.duresssecurity.app.MainActivity'; do
            if ! grep -Fq "$component" apk-manifest.txt; then
              echo "ERROR: final APK manifest is missing required component $component" >&2
              exit 1
            fi
          done
          if ! grep -Fq 'android.permission.BIND_DEVICE_ADMIN' apk-manifest.txt; then
            echo 'ERROR: Device Admin receiver binding permission is missing.' >&2
            exit 1
          fi
          if ! grep -Fq 'android.permission.BIND_ACCESSIBILITY_SERVICE' apk-manifest.txt; then
            echo 'ERROR: Accessibility service binding permission is missing.' >&2
            exit 1
          fi
          if ! grep -Fq 'android:allowBackup' apk-manifest.txt; then
            echo 'ERROR: final APK manifest does not expose the expected allowBackup attribute.' >&2
            exit 1
          fi
          "$AAPT" dump badging "$APK" | tee apk-badging.txt
          if ! grep -Eq "application-icon(-[0-9]+)?:'res/drawable/ic_launcher(\.xml)?'" apk-badging.txt; then
            echo 'ERROR: final APK launcher icon is not the calculator drawable.' >&2
            exit 1
          fi
          if ! grep -Fq "launchable-activity: name='com.duresssecurity.app.MainActivity'" apk-badging.txt; then
            echo 'ERROR: final APK launcher activity is not MainActivity.' >&2
            exit 1
          fi
          echo 'OK: final APK is offline, has the required declared security permissions, contains all native security components, and launches the calculator-branded MainActivity.'
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: duress-security-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
      - name: Commit reviewed semver-safe dependency lockfile fixes
        if: success() && (github.ref == 'refs/heads/fix/maintenance-and-app-lock' || github.ref == 'refs/heads/fix/owner-pin-routing-lock-icon-2026-10-17')
        shell: bash
        run: |
          if git diff --quiet -- package-lock.json; then
            echo "Dependency lockfile is already current; no commit needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "fix: update vulnerable transitive dependency versions"
          git push
