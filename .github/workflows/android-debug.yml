name: Android debug APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

permissions:
  contents: read

jobs:
  build-debug-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools platforms;android-35 build-tools;35.0.0
      - name: Install npm dependencies
        run: npm install --no-audit --no-fund
      - name: Run tests
        shell: bash
        run: |
          set +e
          npm test 2>&1 | tee npm-test.log
          code=${PIPESTATUS[0]}
          exit "$code"
      - name: Upload test log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: duress-security-test-log
          path: npm-test.log
          if-no-files-found: error
          retention-days: 7
      - name: Check TypeScript
        run: npm run typecheck
      - name: Build debug APK
        run: npm run apk:debug
      - name: Verify final APK is offline and calculator-branded
        shell: bash
        run: |
          set -euo pipefail
          APK="android/app/build/outputs/apk/debug/app-debug.apk"
          AAPT="$ANDROID_HOME/build-tools/35.0.0/aapt"
          test -f "$APK"
          test -x "$AAPT"
          "$AAPT" dump permissions "$APK" | tee apk-permissions.txt
          if grep -Fq 'android.permission.INTERNET' apk-permissions.txt; then
            echo 'ERROR: final APK still declares INTERNET permission.' >&2
            exit 1
          fi
          if grep -Fq 'android.permission.ACCESS_NETWORK_STATE' apk-permissions.txt; then
            echo 'ERROR: final APK still declares ACCESS_NETWORK_STATE permission.' >&2
            exit 1
          fi
          "$AAPT" dump badging "$APK" | tee apk-badging.txt
          if ! grep -Eq "application-icon(-[0-9]+)?:'res/drawable/ic_launcher(\.xml)?'" apk-badging.txt; then
            echo 'ERROR: final APK launcher icon is not the calculator drawable.' >&2
            exit 1
          fi
          if ! grep -Fq "launchable-activity: name='com.duresssecurity.app.MainActivity'" apk-badging.txt; then
            echo 'ERROR: final APK launcher activity is not MainActivity.' >&2
            exit 1
          fi
          echo 'OK: final APK is offline, calculator-branded, and launches MainActivity.'
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: duress-security-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
