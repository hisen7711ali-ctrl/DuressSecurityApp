name: Android debug APK

# Full verification run after latest security/background repairs.
# Verification trigger: lint repair for uninstall-settings maintenance script.
# This workflow is verification-only: source/lock repairs are applied in-memory to avoid concurrent push races.

on:
  workflow_dispatch:
  push:
    branches: [merged-fix, fix/maintenance-and-app-lock, fix/owner-pin-routing-lock-icon-2026-10-17, merge/full-fix-2026-10-18]

permissions:
  contents: read

env:
  NODE_OPTIONS: --no-deprecation

concurrency:
  group: android-debug-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-debug-apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout source
        uses: actions/checkout@v5
      - name: Restore and type-fix security store
        run: node scripts/repair-store-emergency-result-2026-10-24.mjs
      - name: Apply settings TypeScript repair
        run: node scripts/repair-settings-typescript-2026-10-24.mjs
      - name: Apply zero-warning lint cleanup
        run: node scripts/repair-lint-cleanup-2026-10-24.mjs
      - name: Restore vault verification invariants
        run: node scripts/repair-vault-verification-2026-10-24.mjs
      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools platforms;android-35 build-tools;35.0.0
      - name: Regenerate lockfile from patched dependency constraints
        shell: bash
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund --loglevel=error
      - name: Resolve remaining dependency advisories in workspace
        shell: bash
        run: |
          set +e
          npm audit fix --package-lock-only --force --no-fund --loglevel=error
          code=$?
          set -e
          if [ "$code" -ne 0 ]; then
            echo "npm audit fix returned $code; the explicit audit gate below will report any remaining advisories."
          fi
          exit 0
      - name: Install from refreshed lockfile
        run: npm ci --no-audit --no-fund --loglevel=error
      - name: Generate npm audit report
        if: always()
        shell: bash
        run: |
          set +e
          npm audit --json > npm-audit.json
          audit_exit=$?
          set -e
          echo "npm audit exit code: $audit_exit" >> npm-audit.json.summary
          node --input-type=module -e '
            import fs from "node:fs";
            try {
              const report = JSON.parse(fs.readFileSync("npm-audit.json", "utf8"));
              const v = report.metadata?.vulnerabilities ?? {};
              const line = "npm audit: " + (v.total ?? "unknown") + " findings — critical " + (v.critical ?? 0) + ", high " + (v.high ?? 0) + ", moderate " + (v.moderate ?? 0) + ", low " + (v.low ?? 0);
              console.log(line);
              fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, line + "\n");
              for (const [name, item] of Object.entries(report.vulnerabilities ?? {})) console.log("- " + name + ": " + item.severity + "; direct=" + item.isDirect + "; fixAvailable=" + JSON.stringify(item.fixAvailable));
            } catch { console.log("npm audit returned no parseable JSON report; inspect npm-audit.json and install output."); }
          '
      - name: Upload npm audit report
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: duress-security-npm-audit-report
          path: |
            npm-audit.json
            npm-audit.json.summary
          if-no-files-found: warn
          retention-days: 7
      - name: Fail CI when high or critical dependency advisories remain
        run: npm audit --audit-level=high --loglevel=error
      - name: Run tests
        shell: bash
        run: |
          set +e
          npm test 2>&1 | tee npm-test.log
          code=${PIPESTATUS[0]}
          exit "$code"
      - name: Upload test log
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: duress-security-test-log
          path: npm-test.log
          if-no-files-found: ignore
          retention-days: 7
      - name: Check TypeScript
        shell: bash
        run: |
          set +e
          npm run typecheck 2>&1 | tee typecheck.log
          code=${PIPESTATUS[0]}
          exit "$code"
      - name: Upload TypeScript log
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: duress-security-typecheck-log
          path: typecheck.log
          if-no-files-found: ignore
          retention-days: 7
      - name: Check authentication invariants
        shell: bash
        run: |
          set -euo pipefail
          npm run dev > dev-server.log 2>&1 &
          DEV_PID=$!
          cleanup() { kill "$DEV_PID" 2>/dev/null || true; wait "$DEV_PID" 2>/dev/null || true; }
          trap cleanup EXIT
          ready=0
          for _ in $(seq 1 60); do
            if curl --fail --silent --show-error http://127.0.0.1:8080/__app-env >/dev/null; then ready=1; break; fi
            sleep 1
          done
          if [ "$ready" -ne 1 ]; then echo 'ERROR: wrapped Vite dev server did not become ready.' >&2; cat dev-server.log >&2 || true; exit 1; fi
          npm run check:auth
      - name: Lint source with zero-warning policy
        shell: bash
        run: |
          set +e
          npm run lint -- --max-warnings=0 2>&1 | tee lint.log
          code=${PIPESTATUS[0]}
          exit "$code"
      - name: Upload lint log
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: duress-security-lint-log
          path: lint.log
          if-no-files-found: ignore
          retention-days: 7
      - name: Build debug APK
        run: npm run apk:debug
      - name: Verify final APK is offline, calculator-branded, and structurally complete
        shell: bash
        run: |
          set -euo pipefail
          APK="android/app/build/outputs/apk/debug/app-debug.apk"
          AAPT="$ANDROID_HOME/build-tools/35.0.0/aapt"
          test -f "$APK" && test -x "$AAPT"
          "$AAPT" dump permissions "$APK" | tee apk-permissions.txt
          for permission in android.permission.USE_BIOMETRIC android.permission.RECEIVE_BOOT_COMPLETED android.permission.POST_NOTIFICATIONS android.permission.SYSTEM_ALERT_WINDOW android.permission.PACKAGE_USAGE_STATS; do grep -Fq "$permission" apk-permissions.txt || { echo "ERROR: final APK is missing required permission $permission" >&2; exit 1; }; done
          for forbidden in android.permission.INTERNET android.permission.ACCESS_NETWORK_STATE android.permission.QUERY_ALL_PACKAGES; do ! grep -Fq "$forbidden" apk-permissions.txt || { echo "ERROR: final APK declares forbidden broad/network permission $forbidden" >&2; exit 1; }; done
          "$AAPT" dump xmltree "$APK" AndroidManifest.xml | tee apk-manifest.txt
          for component in com.duresssecurity.admin.AdminReceiver com.duresssecurity.admin.BootCompletedReceiver com.duresssecurity.admin.AppLockAccessibilityService com.duresssecurity.app.MainActivity; do grep -Fq "$component" apk-manifest.txt || { echo "ERROR: final APK manifest is missing required component $component" >&2; exit 1; }; done
          grep -Fq 'android.permission.BIND_DEVICE_ADMIN' apk-manifest.txt || { echo 'ERROR: Device Admin receiver binding permission is missing.' >&2; exit 1; }
          grep -Fq 'android.permission.BIND_ACCESSIBILITY_SERVICE' apk-manifest.txt || { echo 'ERROR: Accessibility service binding permission is missing.' >&2; exit 1; }
          grep -Fq 'android:allowBackup' apk-manifest.txt || { echo 'ERROR: final APK manifest does not expose the expected allowBackup attribute.' >&2; exit 1; }
          "$AAPT" dump badging "$APK" | tee apk-badging.txt
          grep -Eq "application-icon(-[0-9]+)?:'res/drawable/ic_launcher(\.xml)?'" apk-badging.txt || { echo 'ERROR: final APK launcher icon is not the calculator drawable.' >&2; exit 1; }
          grep -Fq "launchable-activity: name='com.duresssecurity.app.MainActivity'" apk-badging.txt || { echo 'ERROR: final APK launcher activity is not MainActivity.' >&2; exit 1; }
          echo 'OK: final APK is offline, has the required declared security permissions, contains all native security components, and launches the calculator-branded MainActivity.'
      - name: Upload debug APK
        uses: actions/upload-artifact@v5
        with:
          name: duress-security-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
