name: Repair security flow

on:
  push:
    branches: [merge/full-fix-2026-10-18]

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Apply repair
        run: node scripts/repair-security-flow-2026-10-19.mjs
      - name: Commit repair
        shell: bash
        run: |
          if git diff --quiet -- src/lib/store.ts src/components/lock-gate.tsx src/components/settings-screen.tsx; then
            echo "No repair changes needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/lib/store.ts src/components/lock-gate.tsx src/components/settings-screen.tsx
          git commit -m "fix: repair emergency PIN confirmation and uninstall protection [skip ci]"
          git push
