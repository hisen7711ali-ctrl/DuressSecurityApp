name: Full clean verification

on:
  workflow_dispatch:
  push:
    branches:
      - merge/full-fix-2026-10-18

permissions:
  contents: write

concurrency:
  group: full-clean-verification-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Apply source lint cleanup
        run: node scripts/repair-lint-cleanup-2026-10-24.mjs

      - name: Commit source lint cleanup
        shell: bash
        run: |
          if git diff --quiet -- scripts/repair-uninstall-settings-2026-10-19.mjs scripts/maintenance-and-app-lock-regression.test.mjs src/components/lock-gate.tsx src/components/pins-panel.tsx src/components/settings-screen.tsx src/lib/auth/use-current-user.ts src/lib/vault-crypto.ts; then
            echo "No lint cleanup changes needed."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add scripts/repair-uninstall-settings-2026-10-19.mjs scripts/maintenance-and-app-lock-regression.test.mjs src/components/lock-gate.tsx src/components/pins-panel.tsx src/components/settings-screen.tsx src/lib/auth/use-current-user.ts src/lib/vault-crypto.ts
            git commit -m "fix: remove lint errors and warnings"
            git push
          fi

      - name: Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools platforms;android-35 build-tools;35.0.0

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Dependency audit
        run: npm audit --audit-level=high

      - name: Tests
        run: npm test

      - name: TypeScript
        run: npm run typecheck

      - name: Authentication invariants
        shell: bash
        run: |
          set -euo pipefail
          npm run dev > dev-server.log 2>&1 &
          pid=$!
          trap 'kill "$pid" 2>/dev/null || true' EXIT
          for _ in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:8080/__app-env >/dev/null; then
              npm run check:auth
              exit 0
            fi
            sleep 1
          done
          cat dev-server.log
          exit 1

      - name: Lint with zero-warning policy
        run: npm run lint -- --max-warnings=0

      - name: Build debug APK
        run: npm run apk:debug

      - name: Verify APK
        shell: bash
        run: |
          set -euo pipefail
          apk=android/app/build/outputs/apk/debug/app-debug.apk
          aapt="$ANDROID_HOME/build-tools/35.0.0/aapt"
          test -f "$apk"
          "$aapt" dump badging "$apk" | tee apk-badging.txt
          "$aapt" dump permissions "$apk" | tee apk-permissions.txt
          grep -Fq "launchable-activity: name='com.duresssecurity.app.MainActivity'" apk-badging.txt
          for permission in android.permission.USE_BIOMETRIC android.permission.RECEIVE_BOOT_COMPLETED android.permission.POST_NOTIFICATIONS android.permission.SYSTEM_ALERT_WINDOW android.permission.PACKAGE_USAGE_STATS; do
            grep -Fq "$permission" apk-permissions.txt
          done
          for forbidden in android.permission.INTERNET android.permission.ACCESS_NETWORK_STATE android.permission.QUERY_ALL_PACKAGES; do
            ! grep -Fq "$forbidden" apk-permissions.txt
          done
          "$aapt" dump xmltree "$apk" AndroidManifest.xml | tee apk-manifest.txt
          for component in com.duresssecurity.admin.AdminReceiver com.duresssecurity.admin.BootCompletedReceiver com.duresssecurity.admin.AppLockAccessibilityService com.duresssecurity.app.MainActivity; do
            grep -Fq "$component" apk-manifest.txt
          done
          grep -Fq 'android.permission.BIND_DEVICE_ADMIN' apk-manifest.txt
          grep -Fq 'android.permission.BIND_ACCESSIBILITY_SERVICE' apk-manifest.txt
          echo 'Full clean verification APK checks passed.'

      - name: Upload debug APK
        uses: actions/upload-artifact@v5
        with:
          name: duress-security-debug-apk-clean
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
